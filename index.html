<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ffb6c1;
  --rose:#ffd1dc;
  --lav:#e0c3fc;
  --blue:#b5d8ff;
  --plum:#2b0a3d;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Quicksand',sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:#000;
}

/* 🌌 GALAXY LAYERS */
.galaxy{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(224,195,252,.35), transparent 45%),
    radial-gradient(circle at 80% 40%, rgba(255,182,193,.25), transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(181,216,255,.25), transparent 55%),
    linear-gradient(180deg, #12001c, #000);
  animation: galaxyMove 40s linear infinite;
}

@keyframes galaxyMove{
  0%{background-position:0% 0%}
  50%{background-position:100% 100%}
  100%{background-position:0% 0%}
}

/* ✨ STARS */
.stars{
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 40% 70%, #fff, transparent),
    radial-gradient(1px 1px at 80% 20%, #fff, transparent),
    radial-gradient(1px 1px at 60% 50%, #fff, transparent),
    radial-gradient(1px 1px at 30% 80%, #fff, transparent);
  background-size:400px 400px;
  animation: starsTwinkle 8s ease-in-out infinite alternate;
  opacity:.6;
  z-index:1;
}

@keyframes starsTwinkle{
  from{opacity:.4}
  to{opacity:.8}
}

/* glow overlay */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(circle at bottom, rgba(255,182,193,.18), transparent 60%);
  pointer-events:none;
  z-index:2;
}

/* container */
.container{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:22px;
  position:relative;
  z-index:3;
}

/* RGB ROMANTIC TITLE */
h1{
  font-family:'Playfair Display',serif;
  font-size:2.6rem;
  margin-bottom:6px;
  background:linear-gradient(120deg,var(--pink),var(--rose),var(--lav),var(--blue),var(--rose));
  background-size:400% 400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rgbRomantic 14s ease-in-out infinite;
  text-shadow:0 0 18px rgba(255,182,193,.45),0 0 36px rgba(224,195,252,.25);
}

.subtitle{
  letter-spacing:.08em;
  color:#ffe6ee;
  text-shadow:0 0 12px rgba(255,182,193,.4);
}

/* counter */
#counter{
  margin:18px 0 24px;
  font-size:1rem;
  line-height:1.9;
}

/* calendar */
.calendar{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  border-radius:26px;
  padding:22px;
  max-width:380px;
  width:100%;
  box-shadow:0 30px 60px rgba(0,0,0,.6);
}

.calendar-header{
  font-size:1.35rem;
  font-weight:600;
  margin-bottom:14px;
  color:#ffd6e0;
}

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.day-name{font-size:.75rem;opacity:.7}

.day{
  padding:10px 0;
  border-radius:12px;
  background:rgba(255,255,255,.08);
}

/* SPECIAL DAY */
.special{
  background:linear-gradient(135deg,var(--pink),var(--rose),var(--lav));
  background-size:300% 300%;
  box-shadow:0 0 20px rgba(255,150,180,.9),0 0 40px rgba(255,200,220,.6);
  font-weight:bold;
  cursor:pointer;
  animation:heartbeat 1.6s infinite, rgbRomantic 8s ease infinite;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

.caption{margin-top:14px;color:#ffd1dc;font-style:italic}

/* buttons */
.btn-love{
  margin-top:26px;
  padding:14px 36px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  color:#fff;
  cursor:pointer;
  box-shadow:0 14px 30px rgba(255,150,180,.6);
}

.music-btn,.question-btn{margin-top:14px;color:#ffd6e0;cursor:pointer}

/* romantic text */
.romantic-text{
  margin-top:26px;
  max-width:560px;
  background:rgba(255,255,255,.1);
  padding:18px;
  border-radius:18px;
  line-height:1.9;
  min-height:120px;
}

/* answer */
.answer{
  margin-top:22px;
  font-family:'Playfair Display',serif;
  font-size:1.4rem;
  color:#ffb6c1;
  opacity:0;
  transition:opacity 1.2s ease;
}
.answer.show{opacity:1}

/* hearts */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;
}

.heart{
  position:absolute;
  bottom:-40px;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  to{transform:translateY(-120vh) translateX(60px);opacity:0}
}

@keyframes rgbRomantic{
  0%{background-position:0% 50%}
  25%{background-position:50% 50%}
  50%{background-position:100% 50%}
  75%{background-position:50% 50%}
  100%{background-position:0% 50%}
}
</style>
</head>

<body>

<div class="galaxy"></div>
<div class="stars"></div>
<div class="hearts" id="hearts"></div>

<div class="container">
  <h1>The Day That Started Everything</h1>
  <div class="subtitle">January 18, 2026</div>
  <div id="counter"></div>

  <div class="calendar">
    <div class="calendar-header">January 2026</div>
    <div class="days" id="calendar"></div>
    <div class="caption">— our hearts chose each other —</div>
  </div>

  <button class="btn-love" onclick="startLove()">Read Our Story ❤️</button>
  <div class="music-btn" onclick="toggleMusic()">🎶 Play / Pause Music</div>
  <div class="question-btn" onclick="openLetter()">💌 Open Love Letter</div>

  <div class="romantic-text" id="romanticText"></div>
  <div class="answer" id="answerText">I choose you — again and again ✨</div>
</div>

<script>
/* COUNTER */
const start=new Date("2026-01-18T00:00:00");
setInterval(()=>{
  const now=new Date();
  let diff=now-start;
  const sign=diff>=0;
  diff=Math.abs(diff);
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff/3600000)%24;
  const m=Math.floor(diff/60000)%60;
  const s=Math.floor(diff/1000)%60;
  counter.innerHTML=sign
    ? `We have loved each other for<br><b>${d}</b> days ${h} hours ${m} minutes ${s} seconds`
    : `Counting down <b>${d}</b> days to our beginning`;
},1000);

/* CALENDAR */
const cal=document.getElementById("calendar");
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>cal.innerHTML+=`<div class="day-name">${d}</div>`);
for(let i=0;i<4;i++)cal.innerHTML+="<div></div>";
for(let d=1;d<=31;d++){
  cal.innerHTML+=`<div class="day ${d===18?"special":""}" onclick="${d===18?"showAnswer()":""}">${d}</div>`;
}

/* STORY */
const msg="January 18, 2026 was not just a date. It was the moment two hearts decided to walk together — gently, honestly, and endlessly.";
function startLove(){
  romanticText.innerHTML="";
  let i=0;
  const t=setInterval(()=>{
    romanticText.innerHTML+=msg[i++];
    if(i>=msg.length)clearInterval(t);
  },45);
}

/* HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=Math.random()>.7?"✨":"❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=14+Math.random()*26+"px";
  h.style.opacity=Math.random();
  h.style.animationDuration=6+Math.random()*6+"s";
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},380);

/* EXPLOSION */
function showAnswer(){
  answerText.classList.add("show");
  for(let i=0;i<60;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=20+Math.random()*30+"px";
    h.style.animationDuration=2+Math.random()*3+"s";
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  }
}
</script>

</body>
</html>
