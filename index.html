<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ffb6c1;
  --rose:#ffd1dc;
  --lav:#e0c3fc;
  --blue:#b5d8ff;
}

/* RESET */
*{box-sizing:border-box;margin:0;padding:0}

/* 🌌 GALAXY BACKGROUND */
body{
  font-family:'Quicksand',sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,182,193,.35),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(224,195,252,.35),transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(181,216,255,.25),transparent 50%),
    linear-gradient(120deg,#12001a,#1b0030,#0a0018);
  background-size:200% 200%;
  animation:galaxyMove 60s ease infinite;
}

@keyframes galaxyMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ✨ STARS */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(1px 1px at 20% 30%,white,transparent),
    radial-gradient(1px 1px at 70% 60%,white,transparent),
    radial-gradient(1px 1px at 40% 80%,white,transparent);
  opacity:.5;
  animation:twinkle 6s infinite alternate;
  pointer-events:none;
}

@keyframes twinkle{
  from{opacity:.3}
  to{opacity:.6}
}

/* CONTAINER */
.container{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:22px;
  position:relative;
  z-index:2;
}

/* TITLE */
h1{
  font-family:'Playfair Display',serif;
  font-size:2.6rem;
  margin-bottom:6px;
  background:linear-gradient(120deg,var(--pink),var(--rose),var(--lav),var(--blue));
  background-size:400% 400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rgb 14s ease infinite;
  text-shadow:0 0 25px rgba(255,182,193,.5);
}

@keyframes rgb{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

.subtitle{
  letter-spacing:.08em;
  opacity:.9;
  margin-bottom:10px;
}

#counter{
  margin:16px 0 24px;
  line-height:1.8;
}

/* CALENDAR */
.calendar{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  border-radius:26px;
  padding:22px;
  max-width:380px;
  width:100%;
  box-shadow:0 30px 60px rgba(0,0,0,.6);
}

.calendar-header{
  font-size:1.3rem;
  margin-bottom:14px;
  color:#ffd6e0;
}

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.day-name{font-size:.75rem;opacity:.7}
.day{
  padding:10px 0;
  border-radius:12px;
  background:rgba(255,255,255,.08);
}

.special{
  background:linear-gradient(135deg,var(--pink),var(--rose),var(--lav));
  box-shadow:0 0 30px rgba(255,150,180,.9);
  animation:beat 1.6s infinite;
  cursor:pointer;
}

@keyframes beat{
  50%{transform:scale(1.12)}
}

.caption{
  margin-top:14px;
  font-style:italic;
  color:#ffd1dc;
}

/* BUTTONS */
.btn-love{
  margin-top:26px;
  padding:14px 36px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  color:#fff;
  font-size:1.05rem;
  cursor:pointer;
  box-shadow:0 14px 30px rgba(255,150,180,.6);
}

.music-btn,.question-btn{
  margin-top:14px;
  cursor:pointer;
  color:#ffd6e0;
}

/* TEXT */
.romantic-text{
  margin-top:26px;
  max-width:560px;
  background:rgba(255,255,255,.1);
  padding:18px;
  border-radius:18px;
  line-height:1.9;
  min-height:120px;
}

.answer{
  margin-top:22px;
  font-family:'Playfair Display',serif;
  font-size:1.4rem;
  color:#ffb6c1;
  opacity:0;
  transition:opacity 1s;
}
.answer.show{opacity:1}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.modal.show{display:flex}

.modal-box{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(18px);
  border-radius:28px;
  padding:30px;
  max-width:420px;
  animation:pop .5s ease;
}
@keyframes pop{
  from{opacity:0;transform:scale(.85)}
}

.close{
  margin-top:20px;
  cursor:pointer;
  color:#ffd1dc;
}

/* HEARTS */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.heart{
  position:absolute;
  bottom:-40px;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">
  <h1>The Day That Started Everything</h1>
  <div class="subtitle">January 18, 2026</div>
  <div id="counter"></div>

  <div class="calendar">
    <div class="calendar-header">January 2026</div>
    <div class="days" id="calendar"></div>
    <div class="caption">— our hearts chose each other —</div>
  </div>

  <button class="btn-love" onclick="startLove()">Read Our Story ❤️</button>
  <div class="music-btn" onclick="toggleMusic()">🎶 Play / Pause Music</div>
  <div class="question-btn" onclick="openLetter()">💌 Open Love Letter</div>

  <div class="romantic-text" id="romanticText"></div>
  <div class="answer" id="answerText">I choose you — again and again ✨</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <p>
      Loving you is not something I do once.<br>
      It is something I choose every day,<br>
      in every lifetime, in every universe.
    </p>
    <div class="close" onclick="closeLetter()">Close ❤️</div>
  </div>
</div>

<audio id="bgMusic">
  <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>
/* COUNTER */
const start=new Date("2026-01-18T00:00:00");
setInterval(()=>{
  const now=new Date();
  let d=Math.floor((now-start)/86400000);
  document.getElementById("counter").innerHTML=
    `We have loved each other for<br><b>${Math.abs(d)}</b> days`;
},1000);

/* CALENDAR */
const cal=document.getElementById("calendar");
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>cal.innerHTML+=`<div class="day-name">${d}</div>`);
for(let i=0;i<4;i++)cal.innerHTML+="<div></div>";
for(let d=1;d<=31;d++){
  cal.innerHTML+=`<div class="day ${d===18?"special":""}" onclick="${d===18?"showAnswer()":""}">${d}</div>`;
}

/* STORY */
const msg="January 18, 2026 was not just a date. It was the moment two hearts decided to walk together — gently, honestly, and endlessly.";
function startLove(){
  const box=document.getElementById("romanticText");
  box.innerHTML="";
  let i=0;
  const t=setInterval(()=>{
    box.innerHTML+=msg[i++];
    if(i>=msg.length)clearInterval(t);
  },45);
}

/* MUSIC FIX */
const music=document.getElementById("bgMusic");
let playing=false;
function toggleMusic(){
  if(!playing){
    music.play().then(()=>playing=true);
  }else{
    music.pause();
    playing=false;
  }
}

/* LETTER FIX */
function openLetter(){
  document.getElementById("modal").classList.add("show");
}
function closeLetter(){
  document.getElementById("modal").classList.remove("show");
}

/* HEARTS */
const hearts=document.getElementById("hearts");
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=Math.random()>.7?"✨":"❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=14+Math.random()*28+"px";
  h.style.animationDuration=6+Math.random()*6+"s";
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),9000);
},400);

function showAnswer(){
  document.getElementById("answerText").classList.add("show");
}
</script>

</body>
</html>
