<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Quicksand',sans-serif;
  background:radial-gradient(circle at top,#2b1055,#000);
  color:#fff;
  overflow-x:hidden;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(circle at bottom,rgba(255,182,193,.15),transparent 60%);
  pointer-events:none;
}
.container{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  z-index:2;
  position:relative;
}
h1{
  font-family:'Playfair Display',serif;
  font-size:2.2rem;
  color:#ffccd5;
  text-shadow:0 0 18px rgba(255,204,213,.7);
}
.subtitle{opacity:.9}
#counter{
  margin:14px 0 20px;
  font-size:.95rem;
  line-height:1.6;
  opacity:.9;
}
.calendar{
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(12px);
  border-radius:22px;
  padding:20px;
  max-width:360px;
  width:100%;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
.calendar-header{
  font-size:1.3rem;
  margin-bottom:14px;
  font-weight:600;
}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}
.day-name{font-size:.75rem;opacity:.7}
.day{
  padding:10px 0;
  border-radius:10px;
  background:rgba(255,255,255,.08);
}
.special{
  background:linear-gradient(135deg,#ff4d6d,#ff85a1);
  box-shadow:0 0 18px rgba(255,77,109,.9);
  font-weight:bold;
  cursor:pointer;
}
.caption{margin-top:14px;color:#ffd1dc}
.btn-love{
  margin-top:22px;
  padding:12px 32px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#ff4d6d,#ff85a1);
  color:#fff;
  font-size:1rem;
  cursor:pointer;
  box-shadow:0 12px 28px rgba(255,77,109,.5);
}
.music-btn,.question-btn{
  margin-top:12px;
  cursor:pointer;
  color:#ffd1dc;
}
.romantic-text{
  margin-top:22px;
  max-width:540px;
  background:rgba(255,255,255,.08);
  padding:16px;
  border-radius:16px;
  line-height:1.8;
  min-height:120px;
}
.answer{
  margin-top:18px;
  font-family:'Playfair Display',serif;
  font-size:1.3rem;
  color:#ffb6c1;
  opacity:0;
  transition:opacity 1s ease;
}
.answer.show{opacity:1}

/* MODAL LOVE LETTER */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5;
}
.modal.show{display:flex}
.modal-box{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:26px;
  max-width:420px;
  text-align:center;
  animation:pop .4s ease;
}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.close{margin-top:18px;cursor:pointer;color:#ffd1dc}

/* HEARTS */
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1}
.heart{
  position:absolute;
  bottom:-40px;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  to{transform:translateY(-120vh) translateX(40px);opacity:0}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">
  <h1>The Day That Started Everything</h1>
  <div class="subtitle">January 18, 2026</div>
  <div id="counter"></div>

  <div class="calendar">
    <div class="calendar-header">January 2026</div>
    <div class="days" id="calendar"></div>
    <div class="caption">❤️ Our anniversary</div>
  </div>

  <button class="btn-love" onclick="startLove()">Click Me ❤️</button>
  <div class="music-btn" onclick="toggleMusic()">🎵 Play / Pause Music</div>
  <div class="question-btn" onclick="openLetter()">💌 Open Love Letter</div>

  <div class="romantic-text" id="romanticText"></div>
  <div class="answer" id="answerText">I love you in every universe ✨</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <p>
      Loving you is my favorite choice.<br>
      No matter how time changes,<br>
      my heart always finds you.
    </p>
    <div class="close" onclick="closeLetter()">Close ❤️</div>
  </div>
</div>

<audio id="bgMusic" preload="auto">
  <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>
/* COUNTER REALTIME */
const start=new Date("2026-01-18T00:00:00");
setInterval(()=>{
  const now=new Date();
  let diff=now-start;
  const sign=diff>=0;
  diff=Math.abs(diff);
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff/3600000)%24;
  const m=Math.floor(diff/60000)%60;
  const s=Math.floor(diff/1000)%60;
  document.getElementById("counter").innerHTML=
    sign
    ? `Together for <b>${d}</b> days ${h}h ${m}m ${s}s`
    : `Counting down <b>${d}</b> days`;
},1000);

/* CALENDAR AUTO */
const cal=document.getElementById("calendar");
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
  cal.innerHTML+=`<div class="day-name">${d}</div>`;
});
for(let i=0;i<4;i++)cal.innerHTML+="<div></div>";
for(let d=1;d<=31;d++){
  cal.innerHTML+=`<div class="day ${d===18?"special":""}" onclick="${d===18?"showAnswer()":""}">${d}</div>`;
}

/* TYPING */
const msg="January 18, 2026 is not just a date. It is the beginning of a story we chose to live gently, with trust, love, and growth.";
function startLove(){
  const box=document.getElementById("romanticText");
  box.innerHTML="";
  let i=0;
  const t=setInterval(()=>{
    box.innerHTML+=msg[i++];
    if(i>=msg.length)clearInterval(t);
  },40);
}

/* MUSIC FADE */
const music=document.getElementById("bgMusic");
let playing=false;
function toggleMusic(){
  if(!playing){
    music.volume=0; music.play();
    let v=0; const f=setInterval(()=>{v+=.05;music.volume=v;if(v>=.5)clearInterval(f)},100);
    playing=true;
  }else{
    let v=music.volume;
    const f=setInterval(()=>{v-=.05;music.volume=v;if(v<=0){music.pause();clearInterval(f)}},100);
    playing=false;
  }
}

/* LETTER */
function openLetter(){document.getElementById("modal").classList.add("show")}
function closeLetter(){document.getElementById("modal").classList.remove("show")}

/* HEARTS */
const hearts=document.getElementById("hearts");
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=14+Math.random()*24+"px";
  h.style.opacity=Math.random();
  h.style.animationDuration=6+Math.random()*6+"s";
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),9000);
},450);

/* EXPLOSION */
function showAnswer(){
  document.getElementById("answerText").classList.add("show");
  for(let i=0;i<70;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=20+Math.random()*30+"px";
    h.style.animationDuration=2+Math.random()*3+"s";
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),5000);
  }
}
</script>
</body>
</html>
